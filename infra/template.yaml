AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  Minimal Instagram Insights Collector runtime: one hourly Scheduler, one Lambda,
  one DynamoDB table, two execution roles, and the Lambda standard log group.

Parameters:
  ProjectName:
    Type: String
    Default: instagram-insights
    AllowedPattern: '^[a-z0-9-]{3,32}$'
  Environment:
    Type: String
    Default: production
    AllowedValues: [production]
  InstagramAccountId:
    Type: String
    AllowedPattern: '^[0-9]+$'
    Description: Non-secret Instagram account ID.
  InstagramAccessToken:
    Type: String
    NoEcho: true
    MinLength: 1
    Description: GitHub Environment secret supplied only during deployment.

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 900
    Environment:
      Variables:
        DYNAMODB_TABLE_NAME: !Ref InsightsTable
        INSTAGRAM_ACCOUNT_ID: !Ref InstagramAccountId
        INSTAGRAM_ACCESS_TOKEN: !Ref InstagramAccessToken
        API_VERSION: v26.0
        INSIGHT_METRICS: plays,reach,likes,comments,shares,saves,total_interactions,profile_visits,follows

Resources:
  CollectorLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${ProjectName}-${Environment}-collector
      RetentionInDays: 30

  InsightsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${ProjectName}-${Environment}-observations
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  CollectorExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-${Environment}-collector
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: collector-runtime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteOwnLogs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-${Environment}-collector:*
              - Sid: ReadAndWriteObservations
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem]
                Resource: !GetAtt InsightsTable.Arn

  CollectorFunction:
    Type: AWS::Serverless::Function
    DependsOn: CollectorLogGroup
    Properties:
      FunctionName: !Sub ${ProjectName}-${Environment}-collector
      Description: Scheduled Instagram Insights collection; Backend owns the handler.
      CodeUri: ../backend/src/
      Handler: collector.handler.lambda_handler
      Role: !GetAtt CollectorExecutionRole.Arn

  SchedulerInvokeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-${Environment}-scheduler
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke-collector
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt CollectorFunction.Arn

  HourlySchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub ${ProjectName}-${Environment}-hourly
      Description: Runs the collector at minute zero of every UTC hour.
      GroupName: default
      ScheduleExpression: cron(0 * * * ? *)
      ScheduleExpressionTimezone: UTC
      FlexibleTimeWindow:
        Mode: 'OFF'
      State: ENABLED
      Target:
        Arn: !GetAtt CollectorFunction.Arn
        RoleArn: !GetAtt SchedulerInvokeRole.Arn
        Input: '{"scheduled_time":"<aws.scheduler.scheduled-time>","trigger":"eventbridge-scheduler"}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 60
          MaximumRetryAttempts: 0

Outputs:
  CollectorFunctionName:
    Value: !Ref CollectorFunction
  ScheduleName:
    Value: !Ref HourlySchedule
  InsightsTableName:
    Value: !Ref InsightsTable
