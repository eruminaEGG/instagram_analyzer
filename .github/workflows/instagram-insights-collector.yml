name: Instagram Insights Collector infrastructure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy with Serverless Framework
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      INSTAGRAM_ACCOUNT_ID: ${{ vars.INSTAGRAM_ACCOUNT_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Require deployment configuration without printing values
        shell: bash
        run: |
          set +x
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION INSTAGRAM_ACCOUNT_ID INSTAGRAM_ACCESS_TOKEN; do
            test -n "${!name}" || { echo "Missing GitHub production Environment configuration: $name"; exit 1; }
          done
      - name: Install deployment dependencies
        run: npm ci
      - name: Deploy with Serverless Framework
        run: ./deploy.sh -s production
